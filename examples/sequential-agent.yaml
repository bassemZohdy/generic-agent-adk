# Sequential Agent Configuration
# Ordered pipeline of agents, each building on previous results
# Run with: docker run -v ./sequential-agent.yaml:/app/config/agent.yaml generic-adk-agent-runtime

agent:
  type: SEQUENTIAL
  name: sequential_agent
  description: >
    Execute agents in sequence, with each agent building on the output
    of the previous agent. Useful for step-by-step workflows.

model:
  provider: google
  name: "${ADK_MODEL:gemini-2.0-flash}"
  api_key: "${GOOGLE_API_KEY}"

instructions:
  value: >
    Work through the request systematically, one step at a time.
    Each agent refines and builds on the previous result.

tools:
  enabled:
    - knowledge
    - search
    - code_execution
    - structured_output

execution:
  max_iterations: 3
  steps: 2

output:
  schema: GenericAgentResponse
  key: last_response

state:
  enabled: true

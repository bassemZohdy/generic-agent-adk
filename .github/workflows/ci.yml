name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q

      - name: Validate JSON fixtures
        run: |
          uv run python -m json.tool tests/eval/eval_config.json >/dev/null
          uv run python -m json.tool tests/eval/generic_agent.evalset.json >/dev/null
          uv run python -m json.tool keycloak/realm-basic-agent.json >/dev/null

      - name: Validate evaluation command
        run: uv run python -m basic_agent.evaluation --help

      - name: Validate Compose configuration
        run: docker compose config >/dev/null

      - name: Check patch formatting
        run: git diff --check

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config >/dev/null

      - name: Build shared application image
        run: docker build --tag basic-adk-agent:ci .

[project]
name = "basic-adk-agent"
version = "0.1.0"
description = "A minimal Google ADK agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk[a2a,mcp]>=1.0.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
]

[project.scripts]
release-readiness-eval = "basic_agent.evaluation:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

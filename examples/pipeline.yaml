# Pipeline — You want an agent that runs fixed steps in order (fetch → analyze → summarize).
# Every request flows through the same sequence of stages.
# Run: docker run -v ./pipeline.yaml:/app/config/agent.yaml -e GOOGLE_API_KEY=... generic-adk-agent-runtime

agent:
  use_case: pipeline
  description: Processes each request through fixed ordered steps.

model:
  name: "${ADK_MODEL:gemini-3.6-flash}"

instructions:
  value: >
    Process the input through each stage in order: first gather the relevant
    information, then analyze it, then summarize the findings for the user.

tools:
  enabled:
    - search

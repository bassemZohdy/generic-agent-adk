apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: release-readiness-agent
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
    spec:
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/REPOSITORY/release-readiness-agent:TAG
          ports:
            - containerPort: 8000
          env:
            - name: ADK_MODEL
              value: gemini-3.6-flash
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: google-api-key
                  key: latest
          resources:
            limits:
              cpu: "1"
              memory: 1Gi

# Assistant — You want an agent that answers questions directly in one shot.
# No tools, no iterations: ask, get an answer.
# Run: docker run -v ./assistant.yaml:/app/config/agent.yaml -e GOOGLE_API_KEY=... generic-adk-agent-runtime

agent:
  use_case: assistant
  description: Simple Q&A assistant that answers directly.

model:
  name: "${ADK_MODEL:gemini-3.6-flash}"

instructions:
  value: >
    Answer the user's question directly and concisely in a single response.
    If you are unsure, say so rather than guessing.

tools:
  enabled:
    - knowledge
    - search

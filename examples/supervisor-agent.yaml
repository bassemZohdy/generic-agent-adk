# Supervisor Agent Configuration
# Central supervisor coordinating multiple worker agents
# Run with: docker run -v ./supervisor-agent.yaml:/app/config/agent.yaml generic-adk-agent-runtime

agent:
  type: SUPERVISOR
  name: supervisor_agent
  description: >
    A supervisor agent that coordinates work across multiple worker agents,
    delegating tasks and aggregating results.

model:
  provider: google
  name: "${ADK_MODEL:gemini-2.0-flash}"
  api_key: "${GOOGLE_API_KEY}"

instructions:
  value: >
    Coordinate the work of multiple agents to solve the user's request.
    Delegate specific aspects to workers and synthesize their results.

tools:
  enabled:
    - knowledge
    - search
    - structured_output

execution:
  max_iterations: 3
  workers: 2

output:
  schema: GenericAgentResponse
  key: last_response

state:
  enabled: true

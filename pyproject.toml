[project]
name = "basic-adk-agent"
version = "0.1.0"
description = "A generic configuration-driven Google ADK agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk[a2a,mcp]>=1.0.0",
    "litellm>=1.96.2",
    "msgpack>=1.2.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "PyJWT[crypto]>=2.8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

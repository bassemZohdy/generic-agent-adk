name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write
  checks: write
  pull-requests: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  COVERAGE_THRESHOLD: 85

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check patch formatting
        run: git diff --check

      - name: Validate JSON fixtures
        run: |
          uv run python -m json.tool keycloak/realm-basic-agent.json >/dev/null
          uv run python -m json.tool keycloak/realm-basic-agent-dev.json >/dev/null

      - name: Validate Compose configuration
        run: GRAFANA_ADMIN_PASSWORD=ci-grafana KEYCLOAK_ADMIN_PASSWORD=ci-keycloak docker compose config >/dev/null

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Audit Python dependencies
        run: uvx --from pip-audit pip-audit --strict

      - name: Run tests with coverage
        run: |
          uv run pytest tests/ \
            -v \
            --tb=short \
            --cov=basic_agent \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html

      - name: Upload coverage reports
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            .coverage
            htmlcov/
          retention-days: 5

      - name: Check coverage threshold
        if: matrix.python-version == '3.13'
        run: |
          uv run pytest tests/ \
            --cov=basic_agent \
            --cov-report=term \
            --cov-fail-under=${{ env.COVERAGE_THRESHOLD }}

      - name: Upload coverage to Codecov (optional)
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
          verbose: true

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test, lint]
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: GRAFANA_ADMIN_PASSWORD=ci-grafana KEYCLOAK_ADMIN_PASSWORD=ci-keycloak docker compose config >/dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify-image:
    name: Verify Published Image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and verify image
        run: |
          IMAGE_TAG="${{ needs.build.outputs.image-tag }}"
          IMAGE_TAG="${IMAGE_TAG%%$'\n'*}"
          echo "Verifying image: $IMAGE_TAG"
          docker pull "$IMAGE_TAG"
          docker image inspect "$IMAGE_TAG"

      - name: Verify image dependencies are locked
        run: |
          IMAGE_TAG="${{ needs.build.outputs.image-tag }}"
          IMAGE_TAG="${IMAGE_TAG%%$'\n'*}"
          sh scripts/verify-image-dependencies.sh "$IMAGE_TAG"

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.build.outputs.image-tag }}
          format: table
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Test image startup
        run: |
          IMAGE_TAG="${{ needs.build.outputs.image-tag }}"
          IMAGE_TAG="${IMAGE_TAG%%$'\n'*}"
          docker run --rm -e GOOGLE_API_KEY=ci-smoke -e AGENT_USE_CASE=assistant "$IMAGE_TAG" \
            python -c "from basic_agent.agent import root_agent; assert root_agent.name == 'direct_agent', root_agent.name; print('image startup OK: assistant -> direct_agent')"
          docker run --rm -e GOOGLE_API_KEY=ci-smoke \
            -v "$GITHUB_WORKSPACE/examples/approval-gate.yaml:/app/config/agent.yaml:ro" "$IMAGE_TAG" \
            python -c "from basic_agent.agent import root_agent; assert type(root_agent).__name__ == 'SequentialAgent', type(root_agent).__name__; print('image config OK: approval_gate -> SequentialAgent')"

  notify-success:
    name: Workflow Complete
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "✅ CI/CD pipeline completed successfully"
            echo "✅ Tests passed (199+ tests, coverage ≥ 85%)"
            echo "✅ Docker image built, verified, and smoke-tested"
          else
            echo "❌ CI/CD pipeline failed"
            exit 1
          fi

name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  checks: write
  pull-requests: write

env:
  REGISTRY: ghcr.io
  # ghcr.io rejects mixed-case repository names; github.repository preserves
  # the GitHub owner's casing (bassemZohdy/...), so it must be lowercased
  # explicitly rather than used as-is.
  IMAGE_NAME: bassemzohdy/generic-agent-adk
  COVERAGE_THRESHOLD: 90

jobs:
  sandbox-image:
    name: Verify sandbox image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install image scanners
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b "$RUNNER_TOOL_CACHE"
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b "$RUNNER_TOOL_CACHE"
          echo "$RUNNER_TOOL_CACHE" >> "$GITHUB_PATH"
      - name: Verify pinned sandbox image, scan, and generate SBOM
        env:
          SANDBOX_IMAGE: ${{ vars.SANDBOX_IMAGE_DIGEST || 'python:3.13-slim@sha256:ffb752e139c0a19692a43af8d8523b274222dd68eebad5d583b45c2201c6e30a' }}
        run: sh scripts/verify-sandbox-image.sh "$SANDBOX_IMAGE"

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history for the gitleaks secret scan: GitHub's push event
          # lists at most 20 commits, so a multi-commit push makes gitleaks
          # pick a base revision outside a depth-1 shallow clone and the
          # scan errors out (observed on a 21-commit push). With full
          # history the base always resolves.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.18"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Check patch formatting
        run: git diff --check

      - name: Run Ruff lint and format checks
        run: |
          uvx --from ruff ruff check .
          uvx --from ruff ruff format --check .

      - name: Run Pyright configuration type check
        run: uv run pyright src/basic_agent/config

      - name: Verify ADK upgrade assumptions
        run: uv run python scripts/check-adk-assumptions.py

      - name: Verify GitHub Actions are pinned
        run: uv run python scripts/check-workflow-pins.py

      - name: Compile and validate package metadata
        run: |
          uv run python -m compileall -q src
          uv build --wheel --sdist

      - name: Validate JSON fixtures
        run: |
          uv run python -m json.tool keycloak/realm-basic-agent.json >/dev/null
          uv run python -m json.tool keycloak/realm-basic-agent-dev.json >/dev/null

      - name: Validate YAML and Markdown links
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import yaml

          for path in list(Path("examples").glob("*.yaml")) + [Path("deploy/cloudrun/service.yaml")]:
              yaml.safe_load(path.read_text(encoding="utf-8"))
          print("YAML validation passed")
          PY
          uv run python scripts/check-doc-links.py

      - name: Validate Compose configuration
        run: |
          GRAFANA_ADMIN_PASSWORD=ci-grafana KEYCLOAK_ADMIN_PASSWORD=ci-keycloak docker compose config >/dev/null
          # The sandbox-socket-proxy service renders only under its profile;
          # validate that shape too so a bad profile edit can't slip through.
          GRAFANA_ADMIN_PASSWORD=ci-grafana KEYCLOAK_ADMIN_PASSWORD=ci-keycloak docker compose --profile code-exec config >/dev/null

      - name: Secret scan
        # v3 = Node 24 runtime; v2 is removed from GitHub runners on
        # 2026-09-16 (drop-in migration, no input/output changes).
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.18"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests with coverage
        run: |
          uv run pytest tests/ \
            -v \
            --tb=short \
            --cov=basic_agent \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=${{ env.COVERAGE_THRESHOLD }}

      - name: Upload coverage reports
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-reports
          path: |
            .coverage
            htmlcov/
          retention-days: 5

      - name: Upload coverage to Codecov (optional)
        if: matrix.python-version == '3.13'
        # v7 = Node 24 runtime (v6 bumped the bundled actions/github-script
        # to a Node-24 build); best-effort upload, fail_ci_if_error=false.
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
          verbose: true

  # The optional extras (docker, gke) are opt-in (`uv sync --extra ...`)
  # and therefore never exercised by the default matrix above. They must stay
  # installable from the lock and the full suite must pass with their SDKs
  # present — note the docker import-safety test intentionally skips when the
  # docker SDK is installed; the no-extra matrix legs cover that assertion.

  audit:
    name: Audit Python dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.18"
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Audit Python dependencies
        run: uvx --from pip-audit pip-audit --strict

  # The optional extras are opt-in and therefore never exercised by the
  # default matrix above. The matrix below verifies each supported extra.
  test-extras:
    name: "Test (extras: ${{ matrix.extra }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        extra: ["docker", "gke"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.18"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install dependencies (with ${{ matrix.extra }} extra)
        run: uv sync --frozen --extra ${{ matrix.extra }}

      - name: Run tests with coverage
        run: |
          uv run pytest tests/ \
            -v \
            --tb=short \
            --cov=basic_agent \
            --cov-report=term \
            --cov-fail-under=${{ env.COVERAGE_THRESHOLD }}

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test, test-extras, lint, audit]
    outputs:
      # Unverified staging tag only — never a floating release tag (latest,
      # branch, semver). Those are applied by promote-image only after
      # verify-image passes, so a vulnerable/broken image can never be
      # reachable under a release tag.
      image-tag: ${{ steps.tag.outputs.value }}
      image-digest: ${{ steps.build.outputs.digest }}
      promotion-tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate Compose configuration
        run: GRAFANA_ADMIN_PASSWORD=ci-grafana KEYCLOAK_ADMIN_PASSWORD=ci-keycloak docker compose config >/dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract release metadata
        id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Compute unverified staging tag
        id: tag
        run: echo "value=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image (unverified staging tag)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          pull: true
          tags: ${{ steps.tag.outputs.value }}
          # Attest only registry-bound builds. Buildx cannot attach
          # attestations to the locally loaded PR image.
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      # PRs never push to the registry (forked-PR runs have no registry
      # credentials), so PR-only verification runs here against the locally
      # loaded image instead of in verify-image/promote-image below.
      - name: "[PR] Verify image dependencies are locked"
        if: github.event_name == 'pull_request'
        run: sh scripts/verify-image-dependencies.sh "${{ steps.tag.outputs.value }}"

      - name: "[PR] Scan image for vulnerabilities"
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.tag.outputs.value }}
          format: table
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: "[PR] Test image startup"
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm -e GOOGLE_API_KEY=ci-smoke -e AGENT_USE_CASE=assistant "${{ steps.tag.outputs.value }}" \
            python -c "from basic_agent.agent import root_agent; assert root_agent.name == 'direct_agent', root_agent.name; print('image startup OK: assistant -> direct_agent')"
          docker run --rm -e GOOGLE_API_KEY=ci-smoke \
            -v "$GITHUB_WORKSPACE/examples/approval-gate.yaml:/app/config/agent.yaml:ro" "${{ steps.tag.outputs.value }}" \
            python -c "from basic_agent.agent import root_agent; assert type(root_agent).__name__ == 'SequentialAgent', type(root_agent).__name__; print('image config OK: approval_gate -> SequentialAgent')"
          cid=$(docker run -d --rm -p 18002:8002 -e GOOGLE_API_KEY=ci-smoke -e AUTH_DISABLED=true "${{ steps.tag.outputs.value }}")
          trap 'docker rm -f $cid >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://localhost:18002/docs >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:18002/docs >/dev/null && echo "default CMD serves /docs OK"
          docker rm -f "$cid" >/dev/null

  verify-image:
    name: Verify Staged Image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and verify image
        run: |
          echo "Verifying image: ${{ needs.build.outputs.image-tag }}"
          docker pull "${{ needs.build.outputs.image-tag }}"
          docker image inspect "${{ needs.build.outputs.image-tag }}"

      - name: Verify image dependencies are locked
        run: sh scripts/verify-image-dependencies.sh "${{ needs.build.outputs.image-tag }}"

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.build.outputs.image-tag }}
          format: table
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Test image startup
        run: |
          docker run --rm -e GOOGLE_API_KEY=ci-smoke -e AGENT_USE_CASE=assistant "${{ needs.build.outputs.image-tag }}" \
            python -c "from basic_agent.agent import root_agent; assert root_agent.name == 'direct_agent', root_agent.name; print('image startup OK: assistant -> direct_agent')"
          docker run --rm -e GOOGLE_API_KEY=ci-smoke \
            -v "$GITHUB_WORKSPACE/examples/approval-gate.yaml:/app/config/agent.yaml:ro" "${{ needs.build.outputs.image-tag }}" \
            python -c "from basic_agent.agent import root_agent; assert type(root_agent).__name__ == 'SequentialAgent', type(root_agent).__name__; print('image config OK: approval_gate -> SequentialAgent')"
          cid=$(docker run -d --rm -p 18002:8002 -e GOOGLE_API_KEY=ci-smoke -e AUTH_DISABLED=true "${{ needs.build.outputs.image-tag }}")
          trap 'docker rm -f $cid >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://localhost:18002/docs >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:18002/docs >/dev/null && echo "default CMD serves /docs OK"
          docker rm -f "$cid" >/dev/null

  promote-image:
    name: Promote Verified Image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build, verify-image]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Require version tags to descend from main
        if: startsWith(github.ref, 'refs/tags/v')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign verified image digest
        env:
          COSIGN_EXPERIMENTAL: "1"
          DIGEST_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }}
        run: |
          cosign sign --yes "$DIGEST_REF"
          cosign verify "$DIGEST_REF" \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/ci.yml@.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Promote verified digest to release tags
        run: |
          set -eu
          DIGEST_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }}"
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Promoting $DIGEST_REF -> $tag"
            docker buildx imagetools create -t "$tag" "$DIGEST_REF"
          done <<EOF
          ${{ needs.build.outputs.promotion-tags }}
          EOF

  cleanup-staging-image:
    name: Cleanup Staging Image Tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build, verify-image, promote-image]
    if: always() && needs.build.result != 'cancelled' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove temporary CI tag
        run: |
          docker buildx imagetools rm "${{ needs.build.outputs.image-tag }}" || true

  notify-success:
    name: Workflow Complete
    runs-on: ubuntu-latest
    needs: [lint, test, build, verify-image, promote-image]
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ CI/CD pipeline failed: build"
            exit 1
          fi
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            if [ "${{ needs['verify-image'].result }}" != "success" ] || [ "${{ needs['promote-image'].result }}" != "success" ]; then
              echo "❌ CI/CD pipeline failed: image verification/promotion"
              exit 1
            fi
          fi
          echo "✅ CI/CD pipeline completed successfully"
          echo "✅ Tests passed (coverage ≥ ${{ env.COVERAGE_THRESHOLD }}%)"
          echo "✅ Docker image built, verified, and smoke-tested"

x-app-image: &app-image
  image: ${APP_IMAGE:-basic-adk-agent:local}
  build:
    context: .
    dockerfile: Dockerfile

services:
  otel-lgtm:
    image: grafana/otel-lgtm:0.28.0
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - otel-lgtm-data:/data
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: ["start-dev", "--import-realm"]
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    restart: unless-stopped

  auth-gateway:
    <<: *app-image
    command: ["uvicorn", "basic_agent.auth_gateway:app", "--host", "0.0.0.0", "--port", "8010"]
    environment:
      APP_NAME: ${APP_NAME:-basic_agent}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-docker-compose}
      AGENT_PATTERN: ${AGENT_PATTERN:-generic}
      AGENT_PATTERN_MAX_ITERATIONS: ${AGENT_PATTERN_MAX_ITERATIONS:-3}
      AGENT_PATTERN_REQUIRE_APPROVAL: ${AGENT_PATTERN_REQUIRE_APPROVAL:-false}
      AGENT_PATTERN_SPECIALISTS: ${AGENT_PATTERN_SPECIALISTS:-research,solution,risk}
      AGENT_DESCRIPTION: ${AGENT_DESCRIPTION:-A general-purpose, configuration-driven ADK agent.}
      AGENT_INSTRUCTION: ${AGENT_INSTRUCTION:-Answer the user's request helpfully and accurately.}
      AGENT_TOOLS: ${AGENT_TOOLS:-knowledge,search,code_execution,mcp,openapi,approval,runtime,structured_output}
      AGENT_KNOWLEDGE_FILE: ${AGENT_KNOWLEDGE_FILE:-}
      AGENT_KNOWLEDGE_RESULT_LIMIT: ${AGENT_KNOWLEDGE_RESULT_LIMIT:-3}
      AGENT_MCP_TOOLS: ${AGENT_MCP_TOOLS:-get_service_status}
      AGENT_MCP_TOOL_PREFIX: ${AGENT_MCP_TOOL_PREFIX:-mcp_}
      AGENT_OPENAPI_URL: http://service-api:8001
      AGENT_OPENAPI_PATH: ${AGENT_OPENAPI_PATH:-/status}
      AGENT_OPENAPI_TITLE: ${AGENT_OPENAPI_TITLE:-Configured Service API}
      AGENT_OPENAPI_TOOL_PREFIX: ${AGENT_OPENAPI_TOOL_PREFIX:-api_}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8080/realms/basic-agent}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-http://keycloak:8080/realms/basic-agent/protocol/openid-connect/certs}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-}
      KEYCLOAK_ROLE_CLAIM: ${KEYCLOAK_ROLE_CLAIM:-realm_access.roles}
      KEYCLOAK_REQUIRED_ROLES: ${KEYCLOAK_REQUIRED_ROLES:-agent-user}
    depends_on:
      - keycloak
    labels:
      traefik.enable: "true"
      traefik.http.middlewares.keycloak-auth.forwardauth.address: http://auth-gateway:8010/verify
      traefik.http.middlewares.keycloak-auth.forwardauth.trustForwardHeader: "false"
      traefik.http.middlewares.keycloak-auth.forwardauth.authResponseHeaders: X-Auth-User,X-Auth-Email
    restart: unless-stopped

  api-proxy:
    image: traefik:v3.6.2
    command:
      - --entrypoints.adkapi.address=:8002
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --api.dashboard=false
    ports:
      - "${ADK_API_PORT:-8002}:8002"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - auth-gateway
      - adk-api
    restart: unless-stopped

  adk-api:
    <<: *app-image
    command: ["adk", "api_server", "--host", "0.0.0.0", "--port", "8002", "--auto_create_session", "--a2a", "--session_service_uri=sqlite:////app/.adk/api-sessions.db", "--artifact_service_uri=file:///app/.adk/artifacts", "--memory_service_uri=memory://", "--extra_plugins=basic_agent.agent.GenericAgentPlugin", "/app/basic_agent"]
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      APP_NAME: ${APP_NAME:-basic_agent}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-docker-compose}
      AGENT_PATTERN: ${AGENT_PATTERN:-generic}
      AGENT_PATTERN_MAX_ITERATIONS: ${AGENT_PATTERN_MAX_ITERATIONS:-3}
      AGENT_PATTERN_REQUIRE_APPROVAL: ${AGENT_PATTERN_REQUIRE_APPROVAL:-false}
      AGENT_PATTERN_SPECIALISTS: ${AGENT_PATTERN_SPECIALISTS:-research,solution,risk}
      AGENT_DESCRIPTION: ${AGENT_DESCRIPTION:-A general-purpose, configuration-driven ADK agent.}
      AGENT_INSTRUCTION: ${AGENT_INSTRUCTION:-Answer the user's request helpfully and accurately.}
      AGENT_TOOLS: ${AGENT_TOOLS:-knowledge,search,code_execution,mcp,openapi,approval,runtime,structured_output}
      AGENT_KNOWLEDGE_FILE: ${AGENT_KNOWLEDGE_FILE:-}
      AGENT_KNOWLEDGE_RESULT_LIMIT: ${AGENT_KNOWLEDGE_RESULT_LIMIT:-3}
      AGENT_MCP_TOOLS: ${AGENT_MCP_TOOLS:-get_service_status}
      AGENT_OPENAPI_URL: http://service-api:8001
      AGENT_OPENAPI_PATH: ${AGENT_OPENAPI_PATH:-/status}
      AGENT_OPENAPI_TITLE: ${AGENT_OPENAPI_TITLE:-Configured Service API}
      ADK_MODEL: ${ADK_MODEL:-gemini-3.6-flash}
      AGENT_SERVICE_API_URL: http://service-api:8001
      AGENT_SERVICE_API_KEY: ${AGENT_SERVICE_API_KEY:-local-service-key}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8080/realms/basic-agent}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-http://keycloak:8080/realms/basic-agent/protocol/openid-connect/certs}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-}
      KEYCLOAK_ROLE_CLAIM: ${KEYCLOAK_ROLE_CLAIM:-realm_access.roles}
      AGENT_SERVICE_API_ROLES: ${AGENT_SERVICE_API_ROLES:-agent-user}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      DATABASE_URL: ${DATABASE_URL:-}
      STORAGE_PATH: ${STORAGE_PATH:-}
      MESSAGING_URL: ${MESSAGING_URL:-}
      BROKER_URL: ${BROKER_URL:-}
      CACHE_URL: ${CACHE_URL:-}
      REDIS_URL: ${REDIS_URL:-}
      CACHE_PATH: ${CACHE_PATH:-}
      SEARCH_URL: ${SEARCH_URL:-}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
      SEARCH_INDEX_PATH: ${SEARCH_INDEX_PATH:-}
      LOG_ENDPOINT: ${LOG_ENDPOINT:-}
      LOG_API_KEY: ${LOG_API_KEY:-}
      LOG_FILE: ${LOG_FILE:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-lgtm:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: basic-adk-api
    depends_on:
      - service-api
      - otel-lgtm
      - keycloak
    labels:
      traefik.enable: "true"
      traefik.http.routers.adk-api.entrypoints: adkapi
      traefik.http.routers.adk-api.rule: PathPrefix(`/`)
      traefik.http.routers.adk-api.middlewares: keycloak-auth
      traefik.http.routers.adk-api.service: adk-api
      traefik.http.services.adk-api.loadbalancer.server.port: "8002"
    restart: unless-stopped

  service-api:
    <<: *app-image
    command: ["uvicorn", "basic_agent.service_api:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "${AGENT_SERVICE_API_PORT:-8001}:8001"
    environment:
      APP_NAME: ${APP_NAME:-basic_agent}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-docker-compose}
      AGENT_PATTERN: ${AGENT_PATTERN:-generic}
      AGENT_PATTERN_MAX_ITERATIONS: ${AGENT_PATTERN_MAX_ITERATIONS:-3}
      AGENT_PATTERN_REQUIRE_APPROVAL: ${AGENT_PATTERN_REQUIRE_APPROVAL:-false}
      AGENT_PATTERN_SPECIALISTS: ${AGENT_PATTERN_SPECIALISTS:-research,solution,risk}
      AGENT_DESCRIPTION: ${AGENT_DESCRIPTION:-A general-purpose, configuration-driven ADK agent.}
      AGENT_INSTRUCTION: ${AGENT_INSTRUCTION:-Answer the user's request helpfully and accurately.}
      AGENT_TOOLS: ${AGENT_TOOLS:-knowledge,search,code_execution,mcp,openapi,approval,runtime,structured_output}
      AGENT_OPENAPI_URL: http://service-api:8001
      AGENT_OPENAPI_PATH: ${AGENT_OPENAPI_PATH:-/status}
      AGENT_SERVICE_API_KEY: ${AGENT_SERVICE_API_KEY:-local-service-key}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8080/realms/basic-agent}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-http://keycloak:8080/realms/basic-agent/protocol/openid-connect/certs}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-}
      KEYCLOAK_ROLE_CLAIM: ${KEYCLOAK_ROLE_CLAIM:-realm_access.roles}
      AGENT_SERVICE_API_ROLES: ${AGENT_SERVICE_API_ROLES:-agent-user}
    restart: unless-stopped
    depends_on:
      - keycloak

  live-api:
    <<: *app-image
    command: ["uvicorn", "basic_agent.live_server:app", "--host", "0.0.0.0", "--port", "8003"]
    ports:
      - "${LIVE_API_PORT:-8003}:8003"
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      APP_NAME: ${APP_NAME:-basic_agent}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-docker-compose}
      AGENT_PATTERN: ${AGENT_PATTERN:-generic}
      AGENT_PATTERN_MAX_ITERATIONS: ${AGENT_PATTERN_MAX_ITERATIONS:-3}
      AGENT_PATTERN_REQUIRE_APPROVAL: ${AGENT_PATTERN_REQUIRE_APPROVAL:-false}
      AGENT_PATTERN_SPECIALISTS: ${AGENT_PATTERN_SPECIALISTS:-research,solution,risk}
      AGENT_DESCRIPTION: ${AGENT_DESCRIPTION:-A general-purpose, configuration-driven ADK agent.}
      AGENT_INSTRUCTION: ${AGENT_INSTRUCTION:-Answer the user's request helpfully and accurately.}
      AGENT_TOOLS: ${AGENT_TOOLS:-knowledge,search,code_execution,mcp,openapi,approval,runtime,structured_output}
      ADK_MODEL: ${LIVE_ADK_MODEL:-gemini-3.1-flash-live-preview}
      LIVE_ADK_MODEL: ${LIVE_ADK_MODEL:-gemini-3.1-flash-live-preview}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      DATABASE_URL: ${DATABASE_URL:-}
      STORAGE_PATH: ${STORAGE_PATH:-}
      MESSAGING_URL: ${MESSAGING_URL:-}
      BROKER_URL: ${BROKER_URL:-}
      CACHE_URL: ${CACHE_URL:-}
      REDIS_URL: ${REDIS_URL:-}
      CACHE_PATH: ${CACHE_PATH:-}
      SEARCH_URL: ${SEARCH_URL:-}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
      SEARCH_INDEX_PATH: ${SEARCH_INDEX_PATH:-}
      LOG_ENDPOINT: ${LOG_ENDPOINT:-}
      LOG_API_KEY: ${LOG_API_KEY:-}
      LOG_FILE: ${LOG_FILE:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-lgtm:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: basic-adk-live-api
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8080/realms/basic-agent}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-http://keycloak:8080/realms/basic-agent/protocol/openid-connect/certs}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-}
      KEYCLOAK_ROLE_CLAIM: ${KEYCLOAK_ROLE_CLAIM:-realm_access.roles}
      LIVE_API_ROLES: ${LIVE_API_ROLES:-agent-user}
    restart: unless-stopped
    depends_on:
      - otel-lgtm
      - keycloak


volumes:
  otel-lgtm-data:

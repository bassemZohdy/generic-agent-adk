# Direct Agent Configuration
# Single, configuration-driven agent without tool looping
# Run with: docker run -v ./direct-agent.yaml:/app/config/agent.yaml generic-adk-agent-runtime

agent:
  type: DIRECT
  name: direct_agent
  description: A direct, single-shot agent answering requests without tool looping.

model:
  provider: google
  name: "${ADK_MODEL:gemini-2.0-flash}"
  api_key: "${GOOGLE_API_KEY}"

instructions:
  value: >
    Answer the user's request directly and concisely.
    Be helpful, accurate, and honest.
    Cite sources when available.

tools:
  enabled:
    - knowledge
    - search
    - structured_output

execution:
  max_iterations: 1

output:
  schema: GenericAgentResponse
  key: last_response

state:
  enabled: true

[project]
name = "basic-adk-agent"
version = "0.1.0"
description = "A generic configuration-driven Google ADK agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk[a2a,mcp]>=1.0.0",
    "litellm>=1.96.2",
    "msgpack>=1.2.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "PyJWT[crypto]>=2.8.0",
]

[project.optional-dependencies]
# Just the docker SDK for the docker_container code-execution strategy; the
# ADK lazy-import chain only needs `import docker` to succeed, so the broad
# google-adk[extensions] extra is deliberately not pulled in. Install with
# `uv sync --extra docker`.
docker = ["docker>=7.0.0"]
# kubernetes SDK for the gke code-execution strategy (gke_code_executor has
# a hard module-level `import kubernetes`). Job mode (default) needs nothing
# else; executor_type="sandbox" additionally imports k8s_agent_sandbox,
# whose PyPI name/version is unverified — pin it if you adopt sandbox mode.
gke = ["kubernetes>=29.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
filterwarnings = [
    # Known, tracked, and expected to persist until ADK ships Workflow as an
    # LlmAgent sub-agent (see docs/ADR-003-adk-workflow-migration.md's
    # migration gate). Not a warning we can act on yet; silence the noise
    # without hiding unrelated deprecations.
    "ignore:.*is deprecated in favor of Workflow.*:DeprecationWarning",
    # ---- Third-party noise we cannot act on from this repo ----
    # ADK 2.6.3 constructs BaseAgentConfig internally when BaseAgent
    # subclasses are instantiated; the deprecation is aimed at ADK's own
    # callers, not us. Re-check on google-adk upgrades.
    "ignore:BaseAgentConfig is deprecated:DeprecationWarning",
    # ADK's own fast_api/get_agent_app plumbing still passes `plugins=`.
    "ignore:The `plugins` argument is deprecated:DeprecationWarning",
    # Experimental ADK features we deliberately exercise in tests.
    "ignore:\\[EXPERIMENTAL\\].*:UserWarning",
    # pydantic_settings introspects FastAPI's lifespan forward ref.
    "ignore:Field 'lifespan' has an incomplete definition:Warning",
    # fastapi's testclient still uses httpx; upstream migration pending.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning",
]
# Anything NOT listed above surfaces loudly — the list is curated, not a
# blanket -W ignore. New deprecations in our own code or newly actionable
# upstream ones will fail review instead of drowning in noise.

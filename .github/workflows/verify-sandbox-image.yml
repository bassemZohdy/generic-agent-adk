name: Verify Sandbox Image

on:
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-sandbox:
    name: Scan pinned sandbox image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install image scanners
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b "$RUNNER_TOOL_CACHE"
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b "$RUNNER_TOOL_CACHE"
          echo "$RUNNER_TOOL_CACHE" >> "$GITHUB_PATH"
      - name: Verify pinned sandbox image, scan, and generate SBOM
        env:
          SANDBOX_IMAGE: ${{ vars.SANDBOX_IMAGE_DIGEST || 'python:3.13-slim-bookworm@sha256:00faa2debb87529f9f0764e9491d8ba400a3678976616c3bd7cb193745ac20d1' }}
        run: sh scripts/verify-sandbox-image.sh "$SANDBOX_IMAGE"

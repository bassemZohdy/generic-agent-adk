services:
  otel-lgtm:
    image: grafana/otel-lgtm:0.28.0
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - otel-lgtm-data:/data
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: ["start-dev", "--import-realm"]
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    restart: unless-stopped

  auth-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "basic_agent.auth_gateway:app", "--host", "0.0.0.0", "--port", "8010"]
    environment:
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8080/realms/basic-agent}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-http://keycloak:8080/realms/basic-agent/protocol/openid-connect/certs}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-}
    depends_on:
      - keycloak
    labels:
      traefik.enable: "true"
      traefik.http.middlewares.keycloak-auth.forwardauth.address: http://auth-gateway:8010/verify
      traefik.http.middlewares.keycloak-auth.forwardauth.trustForwardHeader: "false"
      traefik.http.middlewares.keycloak-auth.forwardauth.authResponseHeaders: X-Auth-User,X-Auth-Email
    restart: unless-stopped

  auth-proxy:
    image: traefik:v3.6.2
    command:
      - --entrypoints.web.address=:8000
      - --entrypoints.adkapi.address=:8002
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --api.dashboard=false
    ports:
      - "${ADK_PORT:-8000}:8000"
      - "${ADK_API_PORT:-8002}:8002"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - auth-gateway
      - agent
      - adk-api
    restart: unless-stopped

  adk-api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["adk", "api_server", "--host", "0.0.0.0", "--port", "8002", "--auto_create_session", "--a2a", "--session_service_uri=sqlite:////app/.adk/api-sessions.db", "--artifact_service_uri=file:///app/.adk/artifacts", "--memory_service_uri=memory://", "--extra_plugins=basic_agent.agent.ReleaseReadinessPlugin", "/app/basic_agent"]
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ADK_MODEL: ${ADK_MODEL:-gemini-3.6-flash}
      RELEASE_API_URL: http://release-api:8001
      RELEASE_API_KEY: ${RELEASE_API_KEY:-local-release-key}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8080/realms/basic-agent}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-http://keycloak:8080/realms/basic-agent/protocol/openid-connect/certs}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      DATABASE_URL: ${DATABASE_URL:-}
      STORAGE_PATH: ${STORAGE_PATH:-}
      MESSAGING_URL: ${MESSAGING_URL:-}
      BROKER_URL: ${BROKER_URL:-}
      CACHE_URL: ${CACHE_URL:-}
      REDIS_URL: ${REDIS_URL:-}
      CACHE_PATH: ${CACHE_PATH:-}
      SEARCH_URL: ${SEARCH_URL:-}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
      SEARCH_INDEX_PATH: ${SEARCH_INDEX_PATH:-}
      LOG_ENDPOINT: ${LOG_ENDPOINT:-}
      LOG_API_KEY: ${LOG_API_KEY:-}
      LOG_FILE: ${LOG_FILE:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-lgtm:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: basic-adk-api
    depends_on:
      - release-api
      - otel-lgtm
      - keycloak
    labels:
      traefik.enable: "true"
      traefik.http.routers.adk-api.entrypoints: adkapi
      traefik.http.routers.adk-api.rule: PathPrefix(`/`)
      traefik.http.routers.adk-api.middlewares: keycloak-auth
      traefik.http.routers.adk-api.service: adk-api
      traefik.http.services.adk-api.loadbalancer.server.port: "8002"
    restart: unless-stopped

  release-api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "basic_agent.release_api:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "${RELEASE_API_PORT:-8001}:8001"
    environment:
      RELEASE_API_KEY: ${RELEASE_API_KEY:-local-release-key}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8080/realms/basic-agent}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-http://keycloak:8080/realms/basic-agent/protocol/openid-connect/certs}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-}
    restart: unless-stopped
    depends_on:
      - keycloak

  live-api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "basic_agent.live_server:app", "--host", "0.0.0.0", "--port", "8003"]
    ports:
      - "${LIVE_API_PORT:-8003}:8003"
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ADK_MODEL: ${LIVE_ADK_MODEL:-gemini-3.1-flash-live-preview}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      DATABASE_URL: ${DATABASE_URL:-}
      STORAGE_PATH: ${STORAGE_PATH:-}
      MESSAGING_URL: ${MESSAGING_URL:-}
      BROKER_URL: ${BROKER_URL:-}
      CACHE_URL: ${CACHE_URL:-}
      REDIS_URL: ${REDIS_URL:-}
      CACHE_PATH: ${CACHE_PATH:-}
      SEARCH_URL: ${SEARCH_URL:-}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
      SEARCH_INDEX_PATH: ${SEARCH_INDEX_PATH:-}
      LOG_ENDPOINT: ${LOG_ENDPOINT:-}
      LOG_API_KEY: ${LOG_API_KEY:-}
      LOG_FILE: ${LOG_FILE:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-lgtm:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: basic-adk-live-api
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8080/realms/basic-agent}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-http://keycloak:8080/realms/basic-agent/protocol/openid-connect/certs}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-}
    restart: unless-stopped
    depends_on:
      - otel-lgtm
      - keycloak

  agent:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["adk", "web", "--host", "0.0.0.0", "--port", "8000", "--session_service_uri=sqlite:////app/.adk/sessions.db", "--artifact_service_uri=file:///app/.adk/artifacts", "--memory_service_uri=memory://", "--extra_plugins=basic_agent.agent.ReleaseReadinessPlugin", "/app/basic_agent"]
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ADK_MODEL: ${ADK_MODEL:-gemini-3.6-flash}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      DATABASE_URL: ${DATABASE_URL:-}
      STORAGE_PATH: ${STORAGE_PATH:-}
      MESSAGING_URL: ${MESSAGING_URL:-}
      BROKER_URL: ${BROKER_URL:-}
      CACHE_URL: ${CACHE_URL:-}
      REDIS_URL: ${REDIS_URL:-}
      CACHE_PATH: ${CACHE_PATH:-}
      SEARCH_URL: ${SEARCH_URL:-}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
      SEARCH_INDEX_PATH: ${SEARCH_INDEX_PATH:-}
      LOG_ENDPOINT: ${LOG_ENDPOINT:-}
      LOG_API_KEY: ${LOG_API_KEY:-}
      LOG_FILE: ${LOG_FILE:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-lgtm:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: basic-adk-web
      RELEASE_API_URL: http://release-api:8001
      RELEASE_API_KEY: ${RELEASE_API_KEY:-local-release-key}
    depends_on:
      - release-api
      - keycloak
    labels:
      traefik.enable: "true"
      traefik.http.routers.adk-web.entrypoints: web
      traefik.http.routers.adk-web.rule: PathPrefix(`/`)
      traefik.http.routers.adk-web.middlewares: keycloak-auth
      traefik.http.routers.adk-web.service: adk-web
      traefik.http.services.adk-web.loadbalancer.server.port: "8000"
    restart: unless-stopped

volumes:
  otel-lgtm-data:

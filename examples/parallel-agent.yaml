# Parallel Agent Configuration
# Multiple independent agents running concurrently
# Run with: docker run -v ./parallel-agent.yaml:/app/config/agent.yaml generic-adk-agent-runtime

agent:
  type: PARALLEL
  name: parallel_agent
  description: >
    Run multiple agents concurrently to gain independent perspectives
    and aggregate diverse viewpoints on a problem.

model:
  provider: google
  name: "${ADK_MODEL:gemini-2.0-flash}"
  api_key: "${GOOGLE_API_KEY}"

instructions:
  value: >
    Provide your unique perspective on the user's request.
    Focus on your specific angle and expertise.

tools:
  enabled:
    - knowledge
    - search
    - structured_output

execution:
  max_iterations: 3
  workers: 2

output:
  schema: GenericAgentResponse
  key: last_response

state:
  enabled: true
